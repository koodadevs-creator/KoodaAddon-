plugins {
    id 'fabric-loom' version '1.12-SNAPSHOT'
    id 'maven-publish'
    id 'java'
}

// Modern Gradle requires configuring the base name inside the 'base' block
base {
    archivesName = project.archives_base_name
}

// Project identification
version = project.mod_version
group = project.maven_group

// Java Configuration
java {
    // Java 21 is required for Minecraft 1.21+
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// ... (keep the repositories block and everything below it exactly as it was)
repositories {
    mavenCentral()
    maven { url "https://maven.meteordev.org/releases"}
    maven { url "https://maven.meteordev.org/snapshots" }
}


loom {
    accessWidenerPath = file("src/main/resources/streak-addon.accesswidener")
}

dependencies {
    // Fabric - Standard dependencies
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor Client API
    // Using modCompileOnly to avoid bundling Meteor with the addon
    modCompileOnly "meteordevelopment:meteor-client:${project.meteor_version}"

    // Using modLocalRuntime to run the client in the IDE
    modLocalRuntime "meteordevelopment:meteor-client:${project.meteor_version}"
}

processResources {
    inputs.properties([
            "version": project.version,
            "mc_version": project.minecraft_version
    ])

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    // Ensure UTF-8 encoding is used
    it.options.encoding("UTF-8")
    it.options.release = 21
}